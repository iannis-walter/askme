# Render Blueprint for the FastAPI backend (free plan).
# In Render: New → Blueprint → point at this repo. The free web service sleeps
# after ~15 min idle, so the first request after a pause has a cold start
# (~30-50s) — fine for a portfolio.
#
# Set the three secret/per-deploy values in the Render dashboard (they are
# sync:false below, so Render prompts for them and never stores them in git):
#   - LLM_API_KEY     → a Claude API key (platform.claude.com, the Console org
#                       linked to the Claude Max plan so its monthly credits apply)
#   - FRONTEND_ORIGIN → your deployed Vercel origin, e.g. https://ask-me.vercel.app
#   - BACKEND_SHARED_SECRET → a long random string, the SAME value as the Vercel
#                       project's BACKEND_SHARED_SECRET. Set it on Vercel first:
#                       once it is set here, calls without it are refused.
services:
  - type: web
    name: ask-me-backend
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerContext: .              # repo root, so content/ is baked into the image
    dockerCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: LLM_PROVIDER         # Claude: Haiku for CV look-ups, Sonnet for judgment
        value: anthropic
      - key: LLM_MODEL_SIMPLE
        value: claude-haiku-5-5
      - key: LLM_MODEL
        value: claude-sonnet-5-5
      - key: RETRIEVER            # no embeddings API on Claude → keyword retrieval
        value: keyword
      - key: DAILY_REQUEST_BUDGET # service-wide cap per UTC day (chat=1, job-fit=2, agent=4),
        value: "200"              # sized so abuse cannot spend the monthly API credits
      - key: LLM_API_KEY
        sync: false               # set in dashboard (secret)
      - key: FRONTEND_ORIGIN
        sync: false               # set to your Vercel URL (CORS)
      - key: BACKEND_SHARED_SECRET
        sync: false               # same value as on Vercel (secret)
